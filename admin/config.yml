backend:
  name: git-gateway
  repo: euveronese-git/robsonimoveiscury
  branch: main

local_backend: true
publish_mode: editorial_workflow
locale: pt

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: properties
    label: Imóveis
    label_singular: Imóvel
    folder: content/properties
    create: true
    delete: true
    slug: "{{titulo}}"
    extension: json
    format: json
    identifier_field: titulo
    summary: "{{titulo}} — {{tipo}}"
    sortable_fields: ["destaque", "titulo", "tipo"]
    fields:
      - {
          label: Destaque,
          name: destaque,
          widget: boolean,
          default: false,
          required: false,
          hint: "Marque para aparecer na seção Em destaque da home",
        }
      - { label: Título do empreendimento, name: titulo, widget: string }
      - label: Tipo
        name: tipo
        widget: select
        options:
          - Lançamento
          - Pronta Entrega
      - { label: Bairro, name: bairro, widget: string }
      - { label: Endereço, name: endereco, widget: string }
      - { label: Metragem, name: metragem, widget: string, hint: "Ex: 42 a 67 m²" }
      - { label: Quartos, name: quartos, widget: string, hint: "Ex: 2 e 3" }
      - { label: Vagas, name: vagas, widget: string, hint: "Ex: 1" }
      - { label: Faixa de preço, name: faixa_preco, widget: string, hint: "Ex: A partir de R$ 280 mil" }
      - { label: Descrição curta, name: descricao, widget: text }
      - label: Fotos
        name: fotos
        widget: list
        allow_add: true
        min: 1
        max: 50
        hint: "A primeira foto é a capa do card no site. Até 50 fotos, JPG ou PNG com cerca de 1,5 MB cada."
        field: { label: Foto, name: image, widget: image }

  - name: site
    label: Site
    files:
      - file: content/site.json
        name: sobre
        label: Textos e fotos da home
        fields:
          - {
              label: Foto de capa (hero),
              name: capa_hero,
              widget: image,
              hint: "Imagem de fundo da primeira tela. Salve como rascunho; o site só muda depois da publicação.",
            }
          - {
              label: Foto do Robson,
              name: foto,
              widget: image,
              hint: "Aparece na seção Sobre.",
            }
          - { label: Subtítulo da marca (topo), name: marca_sub, widget: string }
          - { label: Linha acima do título (hero), name: hero_eyebrow, widget: string }
          - { label: Título principal, name: hero_titulo, widget: string, hint: "Use Enter para quebrar a linha." }
          - { label: Texto de introdução, name: hero_lead, widget: text }
          - label: Regiões (hero e abas)
            name: regioes
            widget: list
            hint: "Uma por linha. Também viram as abas em Escolha a sua planta."
            field: { label: Região, name: item, widget: string }
          - label: Lista de vantagens do hero
            name: hero_bullets
            widget: list
            field: { label: Item, name: item, widget: string }
          - { label: Título da seção destaque, name: featured_titulo, widget: string }
          - { label: Texto da seção destaque, name: featured_texto, widget: text }
          - { label: Linha acima das plantas, name: plantas_eyebrow, widget: string }
          - { label: Título das plantas, name: plantas_titulo, widget: string }
          - { label: Texto das plantas, name: plantas_texto, widget: text }
          - { label: Nome na seção Sobre, name: sobre_titulo, widget: string }
          - { label: Texto Sobre, name: sobre_texto, widget: text, hint: "Parágrafos separados por linha em branco." }
          - { label: Título do contato, name: contato_titulo, widget: string }
          - { label: Texto do contato, name: contato_texto, widget: text }
          - { label: Linha do rodapé, name: footer_linha, widget: string }
